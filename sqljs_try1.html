<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL.js demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1 class="text-center my-4">Sql.js mini project</h1>
      <div class="accordion shadow" id="accordionExample">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
              <i class="bi bi-1-circle-fill me-1"></i>ПРИМЕР С ИМПОРТИРАНА SQLITE БД
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
            <div class="accordion-body">
              <div class="mb-4">
                  <label for="db_file" class="form-label">Импортиране на SQLite БД</label>
                  <input 
                    type="file"
                    id="db_file"
                    class="form-control"
                    accept=".db, .sqlite, .sqlite3">
                </div>
                <div class="mb-3">
                  <label for="sql_query">SQL заявка</label>
                  <textarea 
                    name="" 
                    id="sql_query"
                    class="form-control font-monospace"
                    rows="6"
                    placeholder="Въведете SQL заявка тук..."></textarea>
                </div>
                <div class="invalid-feedback d-block mb-2" id="missingDbErrorContainer"></div>
                <button
                  type="button"
                  id="run_query"
                  class="btn btn-pink">
                  <i class="bi bi-play-fill"></i>
                  Изпълни заявката
                </button>
                <div id="results2" class="mt-3">
                  <div class="d-none">Резултати от SQLite БД:</div>
                </div>
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
              <i class="bi bi-2-circle-fill me-1"></i>ПРИМЕР С ХАРДКОДНАТИ БД И ЗАЯВКИ
            </button>
          </h2>
          <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
            <div class="accordion-body">
              <label for="sql_query_hardcoded" class="form-label">Хардкодната заявка:</label>
                <textarea 
                  name="" 
                  id="sql_query_hardcoded"
                  rows="6"
                  class="form-control font-monospace"
                  disabled></textarea>
                <div id="results1" class="mt-3">
                  <div>Резултати от хардкоднатата БД:</div>
                </div>
            </div>
          </div>
        </div>
        <!-- <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
              Accordion Item #3
            </button>
          </h2>
          <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
            <div class="accordion-body">

            </div>
          </div>
        </div> -->
      </div>

      
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
    <script src="sqljs_try1.js" defer></script>
  </body>
</html>
