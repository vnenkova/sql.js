<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL.js demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-secondary-subtle">
    <div class="container">
      <div class="card my-5 shadow rounded rounded-5">
        <div class="card-header rounded rounded-5 rounded-bottom-0">
          <h1 class="text-center my-4">Sql.js showcase</h1>
        </div>
        <div class="card-body">
          <div class="accordion" id="accordionExample">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                  <i class="bi bi-1-circle-fill me-1"></i>ПРИМЕР С ХАРДКОДНАТИ БД И ЗАЯВКИ
                </button>
              </h2>
              <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body">
                  <label for="sql_query_hardcoded" class="form-label">Хардкодната заявка:</label>
                    <textarea 
                      name="" 
                      id="sql_query_hardcoded"
                      rows="6"
                      class="form-control font-monospace"
                      disabled></textarea>
                    <div id="results1" class="mt-3">
                      <div>Резултати от хардкоднатата БД:</div>
                    </div>
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                  <i class="bi bi-2-circle-fill me-1"></i>ПРИМЕР С ИМПОРТИРАНА SQLITE БД
                </button>
              </h2>
              <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body">
                  <div class="mb-4">
                      <label for="db_file" class="form-label">Импортиране на SQLite БД:</label>
                      <input 
                        type="file"
                        id="db_file"
                        class="form-control"
                        accept=".db, .sqlite, .sqlite3">
                        <small class="text-muted fst-italic">Разрешени файлови формати: .db, .sqlite, .sqlite3</small>
                    </div>
                    <div class="mb-3">
                      <label for="sql_query">SQL SELECT заявка:</label>
                      <textarea 
                        name="" 
                        id="sql_query"
                        class="form-control font-monospace"
                        rows="6"
                        placeholder="Въведете SQL SELECT заявка тук..."></textarea>
                    </div>
                    <div class="invalid-feedback d-block mb-2" id="missingDbErrorContainer"></div>
                    <button
                      type="button"
                      id="run_query"
                      class="btn btn-pink rounded-pill">
                      <i class="bi bi-play-fill"></i>
                      Изпълни заявката
                    </button>
                    <div id="results2" class="mt-3">
                      <div class="d-none">Резултати от SQLite БД:</div>
                    </div>
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                  <i class="bi bi-3-circle-fill me-1"></i>ПРИМЕР С МОДИФИЦИРАНЕ И ЕКСПОРТИРАНЕ НА ИМПОРТИРАНА SQLITE БД
                </button>
              </h2>
              <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body">
                  <div class="mb-4">
                      <label for="db_file_2" class="form-label">Импортиране на SQLite БД:</label>
                      <input 
                        type="file"
                        id="db_file_2"
                        class="form-control"
                        accept=".db, .sqlite, .sqlite3">
                        <small class="text-muted fst-italic">Разрешени файлови формати: .db, .sqlite, .sqlite3</small>
                    </div>
                    <div class="mb-3">
                      <label for="sql_query_2">SQL UPDATE/INSERT/DELETE заявка:</label>
                      <textarea 
                        name="" 
                        id="sql_query_2"
                        class="form-control font-monospace"
                        rows="6"
                        placeholder="Въведете SQL UPDATE/INSERT/DELETE заявка тук..."></textarea>
                    </div>
                    <div class="invalid-feedback d-block mb-2" id="missingDbErrorContainer2"></div>
                    <div class="d-flex justify-content-between" id="twoBtnsDiv">
                      <button
                        type="button"
                        id="run_query_2"
                        class="btn btn-pink rounded-pill">
                        <i class="bi bi-play-fill"></i>
                        Изпълни заявката
                      </button>
                    </div>
                    <div id="results3" class="mt-3 d-none text-success small"></div>
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFour" aria-expanded="false" aria-controls="collapseFour">
                  <i class="bi bi-4-circle-fill me-1"></i>ПРИМЕР СЪС СЪЗДАВАНЕ И ЕКСПОРТИРАНЕ НА БД
                </button>
              </h2>
              <div id="collapseFour" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body">
                    <div class="mb-3">
                      <label for="sql_query_3">SQL CREATE TABLE заявка:</label>
                      <textarea 
                        name="" 
                        id="sql_query_3"
                        class="form-control font-monospace"
                        rows="6"
                        placeholder="Въведете SQL CREATE TABLE заявка тук..."></textarea>
                    </div>
                    <div class="invalid-feedback d-block mb-2 d-none" id="missingDbErrorContainer3"></div>
                    <div class="d-flex justify-content-between" id="twoBtnsDiv2">
                      <button
                        type="button"
                        id="run_query_3"
                        class="btn btn-pink rounded-pill">
                        <i class="bi bi-play-fill"></i>
                        Изпълни заявката
                      </button>
                    </div>
                    <div id="results4" class="mt-3 d-none text-success small"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
    <script src="sqljs_try1.js" defer></script>
  </body>
</html>
